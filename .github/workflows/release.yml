name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Check release prepared
        id: check-release
        if: success()
        run: |
          if [ -f .release-prepared ]; then
            echo "prepared=true" >> $GITHUB_OUTPUT
            echo "version=$(cat .release-prepared)" >> $GITHUB_OUTPUT
          else
            echo "prepared=false" >> $GITHUB_OUTPUT
            echo "No release prepared — skipping post-release steps"
          fi

      - name: Set up QEMU
        if: steps.check-release.outputs.prepared == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        if: steps.check-release.outputs.prepared == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.check-release.outputs.prepared == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.check-release.outputs.prepared == 'true'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.check-release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync package.json to repo
        if: always() && steps.check-release.outputs.prepared == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(cat .release-prepared)
          PKG_SHA=$(gh api repos/${{ github.repository }}/contents/package.json --jq '.sha')
          ENCODED=$(base64 -w 0 package.json)
          gh api repos/${{ github.repository }}/contents/package.json \
            -X PUT \
            -f message="chore: update package.json to v${VERSION}" \
            -f content="$ENCODED" \
            -f sha="$PKG_SHA" \
            --jq '.commit.sha'
          echo "package.json synced to repo for v${VERSION}"
